name: CI

on:
  # GitHub Flow (#260): one trigger per kind of branch, so no commit runs twice. A branch with an
  # open PR runs on `pull_request` (never filtered, so its required checks always report); main
  # runs on `push`, which is what a release tags; a branch with no PR yet runs by hand
  # (`workflow_dispatch`, sent by bun run ci:branch). A new push cancels the previous run
  # (concurrency). A push to main that only changes images starts no run; ci-branches.test.ts keeps
  # that list honest.
  push:
    branches: [main]
    paths-ignore: ["docs/images/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      only:
        description: Which jobs to run
        type: choice
        options: [all, screenshots]
        default: all

permissions:
  contents: read

concurrency:
  # The job choice is in the key: a screenshots-only dispatch must not cancel a full one.
  group: ci-${{ github.ref }}-${{ github.event_name }}-${{ inputs.only }}
  cancel-in-progress: true

jobs:
  # Sonar's own JS/TS rules on the lines a pull request changes, the "new code" the SonarCloud
  # gate judges, so a finding shows up here in a minute instead of after the full test run.
  sonar-lint:
    name: lint:sonar (changed lines)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: the changed lines are taken against the merge-base with the target branch.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: lint:sonar
        run: bun run lint:sonar -- --base "$(git merge-base HEAD origin/${{ github.base_ref }})"

      # The open count per rule over the whole repository only goes down (sonar-baseline.json).
      - name: lint:sonar --ratchet
        run: bun run lint:sonar -- --ratchet

  # Linux runs the whole suite in one job: the exact 100% line and function gate (bun's lcov has
  # no per-function records, so shards could not be merged without weakening it) and SonarCloud.
  test:
    # A dispatched run's jobs have names of their own: a skipped copy of `test (ubuntu-latest)` next to
    # the real check must never stand in for the one the branch rules require.
    name: test (${{ matrix.os }})${{ github.event_name == 'workflow_dispatch' && ' (dispatch)' || '' }}
    if: github.event_name != 'workflow_dispatch' || inputs.only != 'screenshots'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # bash everywhere: stops at the first failing command of a step.
    defaults:
      run:
        shell: bash
    steps:
      # Full history: SonarCloud uses the blame to tell new code from old.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      # Tests create repositories and commit in them.
      - name: Identidade do git
        run: |
          git config --global user.name "flightdeck-ci"
          git config --global user.email "ci@flightdeck.invalid"

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # The TDD order (docs/TDD.md): every feat/fix has an earlier test commit with the same scope,
      # counted from the merge-base with main (a pull request) or from the last tag (a push to
      # main). It needs the full history the checkout above already fetches.
      - name: TDD audit
        run: bun run tdd:audit -- --since auto

      - name: Testes (cobertura 100%)
        run: bun run test

      # SonarCloud, with the lcov report the tests just wrote. The product version marks the
      # new-code period ("previous version"). Skipped where the secret is not available (pull
      # requests from forks).
      - name: Versão para o SonarCloud
        id: sonar
        if: github.event_name != 'workflow_dispatch'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo "FD_VERSION=$(bun -e 'console.log(require("./apps/daemon/package.json").version)')" >> "$GITHUB_ENV"
          if [ -n "$SONAR_TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; fi

      - name: SonarCloud
        if: steps.sonar.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.projectVersion=${{ env.FD_VERSION }}

      - name: Smokes
        run: |
          bun run smoke
          bun run smoke:multi
          bun run smoke:history
          bun run smoke:board
          bun run smoke:deps
          bun run smoke:central
          bun run smoke:workflow
          bun run smoke:ops
          bun run smoke:limits
          bun run smoke:update
          bun run smoke:costs
          bun run smoke:review
          bun run smoke:checkpoints
          bun run smoke:automation
          bun run smoke:terminal
          bun run smoke:run
          bun run smoke:ssh
          bun run smoke:vault
          bun run smoke:actions
          bun run smoke:snippets
          bun run smoke:rules-vault
          bun run smoke:personas
          bun run smoke:watch
          bun run smoke:teams
          bun run smoke:perf
          bun run smoke:otel
          bun run smoke:webhook
          bun run smoke:conta
          bun run smoke:simple
          bun run smoke:github
          bun run smoke:boardsync
          bun run smoke:roi

      - name: System libraries of the Tauri shell (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      # The Tauri context needs the built frontend (frontendDist) to exist.
      - name: cargo check do app
        run: |
          bun run build:desktop
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
          # The unit tests of the shell (phase 33: the checks of `open_result`), on both systems:
          # the disk checks differ (links on Linux, 8.3 names and junctions on Windows).
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  # Windows, the slowest leg (#220: 33 minutes, 25 of them tests), runs the suite in three shards
  # with no coverage: the 100% gate is Linux's. The required check `test (windows-latest)` is the
  # aggregate below.
  test-windows-shard:
    name: test shard ${{ matrix.shard }}/3 (windows-latest)${{ github.event_name == 'workflow_dispatch' && ' (dispatch)' || '' }}
    if: github.event_name != 'workflow_dispatch' || inputs.only != 'screenshots'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      # Full history: SonarCloud uses the blame to tell new code from old.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      # Tests create repositories and commit in them.
      - name: Identidade do git
        run: |
          git config --global user.name "flightdeck-ci"
          git config --global user.email "ci@flightdeck.invalid"

      # Claude Code runs command hooks through Git Bash on Windows; `bash` on PATH may be the WSL
      # launcher in System32, so the hook tests get Git Bash explicitly, as Claude Code does.
      - name: Git Bash para os hooks
        shell: pwsh
        run: |
          $bash = "C:\Program Files\Git\bin\bash.exe"
          & $bash -c 'echo "git bash: $BASH_VERSION"'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "CLAUDE_CODE_GIT_BASH_PATH=$bash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Testes (shard ${{ matrix.shard }}/3)
        run: bun --config=bunfig.area.toml test --timeout=15000 --shard=${{ matrix.shard }}/3

  # The rest of the Windows leg: the smokes, the Rust shell, the bundle budget and the
  # performance baseline.
  checks-windows:
    name: checks (windows-latest)${{ github.event_name == 'workflow_dispatch' && ' (dispatch)' || '' }}
    if: github.event_name != 'workflow_dispatch' || inputs.only != 'screenshots'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      # Full history: SonarCloud uses the blame to tell new code from old.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      # Tests create repositories and commit in them.
      - name: Identidade do git
        run: |
          git config --global user.name "flightdeck-ci"
          git config --global user.email "ci@flightdeck.invalid"

      # Claude Code runs command hooks through Git Bash on Windows; `bash` on PATH may be the WSL
      # launcher in System32, so the hook tests get Git Bash explicitly, as Claude Code does.
      - name: Git Bash para os hooks
        shell: pwsh
        run: |
          $bash = "C:\Program Files\Git\bin\bash.exe"
          & $bash -c 'echo "git bash: $BASH_VERSION"'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "CLAUDE_CODE_GIT_BASH_PATH=$bash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Smokes
        run: |
          bun run smoke
          bun run smoke:multi
          bun run smoke:history
          bun run smoke:board
          bun run smoke:deps
          bun run smoke:central
          bun run smoke:workflow
          bun run smoke:ops
          bun run smoke:limits
          bun run smoke:update
          bun run smoke:costs
          bun run smoke:review
          bun run smoke:checkpoints
          bun run smoke:automation
          bun run smoke:terminal
          bun run smoke:run
          bun run smoke:ssh
          bun run smoke:vault
          bun run smoke:actions
          bun run smoke:snippets
          bun run smoke:rules-vault
          bun run smoke:personas
          bun run smoke:watch
          bun run smoke:teams
          bun run smoke:perf
          bun run smoke:otel
          bun run smoke:webhook
          bun run smoke:conta
          bun run smoke:simple
          bun run smoke:github
          bun run smoke:boardsync
          bun run smoke:roi

      # The Tauri context needs the built frontend (frontendDist) to exist.
      - name: cargo check do app
        run: |
          bun run build:desktop
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      # Phase 28: the entry chunk of the build above stays under its gzip budget (bundle-lazy).
      - name: Bundle budget
        run: bun run bundle:budget

      # Phase 28: the numbers of the performance baseline on this runner, kept as an artifact. It
      # is not a gate: a measure that cannot run says why in its row, and the step never fails the job.
      - name: Performance baseline
        continue-on-error: true
        run: bun run perf:baseline --out perf-baseline

      - name: Performance baseline (artifact)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perf-baseline-windows
          path: perf-baseline
          if-no-files-found: ignore

  # The check the main ruleset requires: it passes only when every shard and the checks passed.
  # always(), so a failed or cancelled shard makes it fail rather than skip.
  test-windows:
    name: test (windows-latest)${{ github.event_name == 'workflow_dispatch' && ' (dispatch)' || '' }}
    needs: [test-windows-shard, checks-windows]
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.only != 'screenshots')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every Windows shard and check passed
        run: |
          echo "shards: ${{ needs.test-windows-shard.result }}, checks: ${{ needs.checks-windows.result }}"
          test "${{ needs.test-windows-shard.result }}" = success
          test "${{ needs.checks-windows.result }}" = success

  # The prints of every screen in both themes and languages and the axe check on them, against
  # the seeded demo (fake runtime: no real Claude, no network). #220 runs them apart from e2e.
  screenshots-prints:
    name: prints and axe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      # The demo seeds repositories and commits in them.
      - name: Identidade do git
        run: |
          git config --global user.name "flightdeck-ci"
          git config --global user.email "ci@flightdeck.invalid"

      # The runner already has Chrome; the prints drive it through playwright-core and the e2e
      # journeys through @playwright/test (no browser is downloaded).
      - name: Chrome do runner
        run: google-chrome --version

      - name: Prints (2 temas, 2 idiomas) e axe
        # record: the prints are the candidates for apps/desktop/visual-baseline. Once the
        # baselines are committed this becomes compare (docs/DECISIONS.md, "Visual baselines").
        env:
          VISUAL: record
        run: bun run demo:shots

      - name: Publicar os prints
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prints
          path: apps/desktop/screenshots
          if-no-files-found: ignore

  # The end-to-end journeys, in both languages, against the same seeded demo.
  screenshots-e2e:
    name: e2e journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      # The demo seeds repositories and commits in them.
      - name: Identidade do git
        run: |
          git config --global user.name "flightdeck-ci"
          git config --global user.email "ci@flightdeck.invalid"

      # The runner already has Chrome; the prints drive it through playwright-core and the e2e
      # journeys through @playwright/test (no browser is downloaded).
      - name: Chrome do runner
        run: google-chrome --version

      - name: Jornadas e2e (2 idiomas)
        # A failed journey leaves its trace, print and the text of the terminal in the e2e-failures
        # artifact (E2E_FAILURES); the HTML report is its own artifact. CI retries a failure once.
        env:
          E2E_FAILURES: apps/desktop/screenshots/e2e-failures
        run: bun run e2e

      # A journey that failed and passed on its retry shows as flaky in the report, never hidden.
      - name: Publicar o relatório e2e
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relatorio-e2e
          path: playwright-report
          if-no-files-found: ignore

      - name: Publicar as falhas e2e
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-failures
          path: apps/desktop/screenshots/e2e-failures
          if-no-files-found: ignore

  # The check the main ruleset requires: it passes only when the prints and the journeys passed.
  screenshots:
    name: screenshots (prints, axe e e2e)
    needs: [screenshots-prints, screenshots-e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The prints and the e2e journeys passed
        run: |
          echo "prints: ${{ needs.screenshots-prints.result }}, e2e: ${{ needs.screenshots-e2e.result }}"
          test "${{ needs.screenshots-prints.result }}" = success
          test "${{ needs.screenshots-e2e.result }}" = success
