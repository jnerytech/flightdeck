name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # bash everywhere (Git Bash on Windows): stops at the first failing command of a step, which
    # pwsh does not do for native programs.
    defaults:
      run:
        shell: bash
    steps:
      # Full history: SonarCloud uses the blame to tell new code from old.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      # Tests create repositories and commit in them.
      - name: Identidade do git
        run: |
          git config --global user.name "flightdeck-ci"
          git config --global user.email "ci@flightdeck.invalid"

      # Claude Code runs command hooks through Git Bash on Windows; `bash` on PATH may be the WSL
      # launcher in System32, so the hook tests get Git Bash explicitly, as Claude Code does.
      - name: Git Bash para os hooks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bash = "C:\Program Files\Git\bin\bash.exe"
          & $bash -c 'echo "git bash: $BASH_VERSION"'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "CLAUDE_CODE_GIT_BASH_PATH=$bash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Testes (cobertura 100%)
        run: bun run test

      # SonarCloud, on the Linux leg only, with the lcov report the tests just wrote. The product
      # version marks the new-code period ("previous version"). Skipped where the secret is not
      # available (pull requests from forks).
      - name: Versão para o SonarCloud
        id: sonar
        if: runner.os == 'Linux'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo "FD_VERSION=$(bun -e 'console.log(require("./apps/daemon/package.json").version)')" >> "$GITHUB_ENV"
          if [ -n "$SONAR_TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; fi

      - name: SonarCloud
        if: steps.sonar.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.projectVersion=${{ env.FD_VERSION }}

      - name: Smokes
        run: |
          bun run smoke
          bun run smoke:multi
          bun run smoke:history
          bun run smoke:board
          bun run smoke:central
          bun run smoke:workflow
          bun run smoke:ops
          bun run smoke:limits
          bun run smoke:update
          bun run smoke:costs
          bun run smoke:review
          bun run smoke:checkpoints
          bun run smoke:automation
          bun run smoke:terminal
          bun run smoke:ssh
          bun run smoke:vault
          bun run smoke:actions
          bun run smoke:snippets
          bun run smoke:rules-vault

      # The Tauri context needs the built frontend (frontendDist) to exist.
      - name: cargo check do app
        if: runner.os == 'Windows'
        run: |
          bun run build:desktop
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

  # The prints of every screen in both themes and languages, the axe check on them and the five
  # end-to-end journeys, all against the seeded demo (fake runtime: no real Claude, no network).
  screenshots:
    name: screenshots (prints, axe e e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      # The demo seeds repositories and commits in them.
      - name: Identidade do git
        run: |
          git config --global user.name "flightdeck-ci"
          git config --global user.email "ci@flightdeck.invalid"

      # The runner already has Chrome; the scripts drive it through playwright-core.
      - name: Chrome do runner
        run: google-chrome --version

      - name: Prints (2 temas, 2 idiomas) e axe
        run: bun run demo:shots

      - name: Jornadas e2e (2 idiomas)
        run: bun run e2e

      - name: Publicar os prints
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prints
          path: apps/desktop/screenshots
          if-no-files-found: ignore
