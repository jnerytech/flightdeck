name: Mutation

# Weekly mutation run (#1607): StrykerJS over the domains in mutation-domains.json, on a GitHub
# runner (an 18-minute run of one file would hold the Pi's slot). It starts on a schedule or by
# hand, never on a push, a pull request or a release: a test (mutation-config.test.ts) keeps it so.
# The score per domain goes to the job summary, the JSON to the artifact; the survivors that are
# business rules become test issues by hand.
on:
  schedule:
    - cron: "23 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation
  cancel-in-progress: false

jobs:
  mutation:
    name: mutation score
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Incremental: a week with no change to a domain's sources or tests restores last week's
      # verdicts and runs in minutes. The key is a digest of those files (#2485): the command runner
      # has no per-test coverage, so Stryker cannot see that a changed test makes an old verdict
      # stale. A change misses the cache and the run starts cold; there is no fallback to an older one.
      - name: Key of the incremental state
        id: cache-key
        run: bun run mutation:cache-key

      - name: Restore the incremental state
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: reports/mutation/*/incremental.json
          key: mutation-incremental-${{ steps.cache-key.outputs.key }}

      - name: Mutation score per domain
        run: bun run mutation:weekly

      - name: Upload the JSON report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-report
          path: reports/mutation
          if-no-files-found: warn
