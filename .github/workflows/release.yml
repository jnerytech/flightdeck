name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (v<x.y.z>), já empurrada"
        required: true

permissions:
  contents: read

jobs:
  # The daemons of the three platforms, their signatures and the CLI's npm tarball (#3541). Linux,
  # because `npm pack` on Windows would not keep the execute bit of the binaries. It holds the signing
  # key in one step and no write access: the release job publishes what it made.
  daemons:
    name: daemons and npm tarball (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Inputs go through the environment, never straight into a script.
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the tag against the product version
        run: bun run release:version "$TAG"

      - name: Daemons (Windows, Linux x64 and arm64)
        run: bun run build:daemon

      - name: Sign the daemons
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run release:sign

      - name: npm tarball (launcher and the three daemons)
        run: bun run release:npm

      # What a person does with the tarball, into a temporary prefix: both commands print the version.
      - name: Install the tarball into a temporary prefix
        run: |
          version="${TAG#v}"
          tarball="./dist/flightdeckd-${version}.tgz"
          ls -l "$tarball"
          npm install -g --prefix "$RUNNER_TEMP/npm-global" --no-audit --no-fund "$tarball"
          "$RUNNER_TEMP/npm-global/bin/flightdeckd" --version | grep -F "flightdeckd ${version} "
          "$RUNNER_TEMP/npm-global/bin/fd" --version | grep -F "flightdeckd ${version} "

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daemons
          path: dist
          if-no-files-found: error
          retention-days: 1

  release:
    name: release (windows)
    needs: daemons
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      # Inputs go through the environment, never straight into a script.
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Conferir a tag com a versão do produto
        run: bun run release:version "$TAG"

      # Fails right away while release/flightdeck.pub is not the project's public key.
      - name: Config de build do app (chave pública e updater)
        run: bun run release:tauri-config

      # Built, signed and packed once, on Linux (the `daemons` job): the installers and the assets
      # carry exactly those bytes.
      - name: Daemons, signatures and npm tarball (from the daemons job)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: daemons
          path: dist

      # The CLI reads a paired host's token through this helper, found beside the app (#3429).
      - name: Credential helper (flightdeck-cred), built as the app's sidecar
        working-directory: apps/desktop/src-tauri
        run: cargo build -p flightdeck-cred --release --locked

      - name: Put the helper where Tauri reads sidecars
        run: bun run release:cred

      - name: Instaladores do app (NSIS e MSI), com o .sig do updater
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build --bundles nsis,msi --config src-tauri/target/tauri.release.conf.json

      - name: Juntar os arquivos, as assinaturas, os manifestos e o SHA256SUMS
        run: bun run release:assets release-assets

      - name: Publicar a release
        run: gh release create "$TAG" --title "$TAG" --generate-notes release-assets/*

  # The engineering metrics of this version (#1949), attached to the release the job above already
  # published: a failure here never blocks it. It reads full history, so it checks the tag out
  # without the depth of 1 and runs on Linux, where the git and gh reads are cheap.
  metrics:
    name: metrics snapshot
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      # The metrics read the CI runs and the merged pull requests with gh.
      actions: read
      pull-requests: read
    env:
      # Inputs go through the environment, never straight into a script.
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Snapshot das métricas
        run: bun run metrics -- --tag "$TAG" --out "metrics-${TAG#v}.json"

      - name: Anexar à release
        run: gh release upload "$TAG" "metrics-${TAG#v}.json" --clobber
