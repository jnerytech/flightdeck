[package]
name = "flightdeck-desktop"
version = "0.1.0"
description = "Flightdeck desktop app"
edition = "2021"
publish = false

[lib]
name = "flightdeck_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Release builds trade build time for a smaller, faster binary (Tauri's recommended profile).
# `panic = "abort"`: the only panic recovery in src/ is tokio's JoinError around `generate_key`,
# which cannot panic today (a test pins that there is one such use). A crash is then a silent exit.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
