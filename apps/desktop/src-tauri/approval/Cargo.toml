[package]
name = "flightdeck-approval"
version = "0.1.0"
description = "#3439: the device key that signs a high-risk approval, and the check of what it is asked to sign, without Tauri"
edition = "2021"
publish = false

[dependencies]
base64 = "0.23"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde_json = "1"
sha2 = "0.10"
