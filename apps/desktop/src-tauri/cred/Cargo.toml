[package]
name = "flightdeck-cred"
version = "0.1.0"
description = "Issue #3429: reads one host's token or address from the OS credential store for the flightdeckd CLI, and writes the app's host name index"
edition = "2021"
publish = false

[lib]
name = "flightdeck_cred"

[[bin]]
name = "flightdeck-cred"
path = "src/main.rs"

[dependencies]
# The same crate, version and features as the app's own writes (lib.rs): one backend, one naming.
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
serde_json = "1"
