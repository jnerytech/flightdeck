# Per-area TDD runs: `bun --config=bunfig.area.toml test <file>`.
# Same as bunfig.toml without the coverage gate, which only makes sense for the whole suite.
[test]
preload = ["./scripts/test/preload.ts"]
coverage = false
# The mods run under `claude plugin test`, not under bun (the same as bunfig.toml).
pathIgnorePatterns = ["mods/**"]
