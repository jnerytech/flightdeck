[test]
preload = ["./scripts/test/preload.ts"]
coverage = true
coverageSkipTestFiles = true
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
coverageThreshold = { lines = 0.8, functions = 0.8 }
coveragePathIgnorePatterns = ["**/test/**", "**/components/ui/**", "**/scripts/demo-seed.ts"]
# The mods run under `claude plugin test`, not under bun.
pathIgnorePatterns = ["mods/**"]
