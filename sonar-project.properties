# SonarCloud analysis, run by the CI (ubuntu leg) after the tests, with their lcov report.
sonar.organization=jnerytech
sonar.projectKey=jnerytech_flightdeck
sonar.projectName=flightdeck

# Sources and tests share the folders: sonar.test.inclusions says which files are test code, so
# Sonar analyses them with its test rules (assertions, focused or skipped tests...).
sonar.sources=apps,packages,scripts
sonar.tests=apps,packages,scripts
sonar.test.inclusions=**/test/**,**/*.test.ts,**/*.test.tsx,scripts/e2e/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,apps/desktop/src-tauri/target/**,apps/desktop/src-tauri/gen/**,apps/desktop/screenshots/**,apps/desktop/src/components/ui/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Sonar reads coverage of exactly the files scripts/check-coverage.ts covers (isCoverageSource in
# scripts/lib/coverage-check.ts); scripts/test/sonar-coverage.test.ts fails when the two drift.
# Left out: process entry points, the shadcn vendor components, the Rust shell, type
# declarations, the build config, and the scripts outside scripts/lib (CLIs the smokes exercise).
sonar.coverage.exclusions=apps/daemon/src/bin.ts,apps/desktop/src/main.tsx,apps/desktop/src/main.web.tsx,apps/desktop/vite.config.ts,apps/desktop/src/components/ui/**,apps/desktop/src-tauri/**,scripts/*.ts,**/*.d.ts
# The two dictionaries (en.ts, pt-BR.ts) hold the same keys by design, and CPD ignores what a string
# says, so every new key reads as a duplicated line of the other dictionary.
# migrations.ts is an append-only list of SQL steps: each new column reads like the one before (#935).
# The smokes are standalone CLIs that each carry their own client and helpers, near copies of one
# another by design, so any line touched in one reads as duplicated (#200).
sonar.cpd.exclusions=**/test/**,**/*.test.ts,**/*.test.tsx,apps/desktop/src/i18n/**,apps/daemon/src/store/migrations.ts,scripts/smoke*.ts

# Tailwind v4 `@utility name { &:hover { ... } @media (...) { decl } }` is valid, but Sonar's CSS parser
# reads @utility as an unknown at-rule and flags the nesting inside it (S8776, S8767). See DECISIONS.
sonar.issue.ignore.multicriteria=css1,css2
sonar.issue.ignore.multicriteria.css1.ruleKey=css:S8776
sonar.issue.ignore.multicriteria.css1.resourceKey=apps/desktop/src/styles.css
sonar.issue.ignore.multicriteria.css2.ruleKey=css:S8767
sonar.issue.ignore.multicriteria.css2.resourceKey=apps/desktop/src/styles.css
