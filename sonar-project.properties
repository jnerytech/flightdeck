# SonarCloud analysis, run by the CI (ubuntu leg) after the tests, with their lcov report.
sonar.organization=jnerytech
sonar.projectKey=jnerytech_flightdeck
sonar.projectName=flightdeck

sonar.sources=apps,packages,scripts
sonar.tests=apps,packages,scripts
sonar.test.inclusions=**/test/**,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/test/**,**/*.test.ts,**/*.test.tsx,**/node_modules/**,**/dist/**,**/coverage/**,apps/desktop/src-tauri/target/**,apps/desktop/src-tauri/gen/**,apps/desktop/screenshots/**,apps/desktop/src/components/ui/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
# The same files scripts/check-coverage.ts leaves out: process entry points, the shadcn vendor
# components, the Rust shell, and the scripts outside scripts/lib (CLIs exercised by the smokes).
sonar.coverage.exclusions=apps/daemon/src/bin.ts,apps/desktop/src/main.tsx,apps/desktop/src/main.web.tsx,apps/desktop/src/components/ui/**,apps/desktop/src-tauri/**,scripts/*.ts,scripts/test/**
sonar.cpd.exclusions=**/test/**,**/*.test.ts,**/*.test.tsx
